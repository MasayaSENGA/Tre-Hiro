<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>トレひろ設定</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <h1>トレひろ</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="knob"></span></span>
        <span class="switch-text" id="enabledText">ON</span>
      </label>
    </header>

    <main class="body">
      <section class="field">
        <div class="field-head">
          <label for="cardWidth">カードの幅</label>
          <span class="value-entry">
            <input class="value" id="cardWidthValue" type="number" min="40" max="100" step="1" aria-label="カードの幅（%）" />
            <span>%</span>
          </span>
        </div>
        <input
          type="range"
          id="cardWidth"
          min="40"
          max="100"
          step="1"
          value="95"
        />
        <div class="scale"><span>40%</span><span>100%</span></div>
        <p class="hint">ウィンドウ幅に対するカード詳細の幅。</p>
      </section>

      <section class="field">
        <div class="field-head">
          <label for="descRatio">左右の比率</label>
          <span class="ratio-values">
            <span class="value-entry">
              <input class="value" id="ratioValue" type="number" min="15" max="90" step="1" aria-label="説明欄の割合（%）" />
              <span>%</span>
            </span>
            <span>:</span>
            <span class="value-entry">
              <input class="value" id="ratioRightValue" type="number" min="10" max="85" step="1" aria-label="コメント欄の割合（%）" />
              <span>%</span>
            </span>
          </span>
        </div>
        <input
          type="range"
          id="descRatio"
          min="15"
          max="90"
          step="1"
          value="40"
        />
        <div class="preview" aria-hidden="true">
          <span class="preview-left" id="previewLeft">説明欄</span>
          <span class="preview-right" id="previewRight">コメント欄</span>
        </div>
        <p class="hint">左＝説明欄・添付／右＝コメントとアクティビティ。</p>
      </section>

      <section class="field">
        <div class="field-head">
          <label for="autoButtons">自動化ボタンを常に表示</label>
          <label class="switch switch-mini">
            <input type="checkbox" id="autoButtons" />
            <span class="track"><span class="knob"></span></span>
            <span class="switch-text" id="autoButtonsText">ON</span>
          </label>
        </div>
        <p class="hint">
          カード詳細の下部に、ボードのカードボタン（自動化）を並べます。押すとその場で実行されます。
        </p>
      </section>

      <section class="field" id="colorField">
        <div class="field-head">
          <label for="colorStrength">カードの色付け</label>
          <label class="switch switch-mini">
            <input type="checkbox" id="colorCards" />
            <span class="track"><span class="knob"></span></span>
            <span class="switch-text" id="colorCardsText">ON</span>
          </label>
        </div>
        <input
          type="range"
          id="colorStrength"
          min="5"
          max="45"
          step="1"
          value="45"
        />
        <div class="scale">
          <span>薄い</span>
          <span class="value-entry">
            <input class="value value-mini" id="colorStrengthValue" type="number" min="5" max="45" step="1" aria-label="カード色の濃さ（%）" />
            <span>%</span>
          </span>
          <span>濃い</span>
        </div>
        <label class="subfield-label" for="colorVibrancy">鮮やかさ</label>
        <input
          type="range"
          id="colorVibrancy"
          min="0"
          max="200"
          step="1"
          value="100"
          list="colorVibrancyMarks"
        />
        <datalist id="colorVibrancyMarks">
          <option value="100"></option>
        </datalist>
        <div class="scale">
          <span>控えめ</span>
          <span class="value-entry">
            <input class="value value-mini" id="colorVibrancyValue" type="number" min="0" max="200" step="1" aria-label="鮮やかさ（%）" />
            <span>%</span>
          </span>
          <span>200%</span>
        </div>
        <div class="swatch" id="swatch" aria-hidden="true"></div>
        <p class="hint">
          鮮やかさを調整して、カードに重ねるラベル色の印象を変えられます。左端の帯はラベルごとに分かれます。
        </p>
      </section>
    </main>

    <footer class="foot">
      <button type="button" id="reset" class="reset">既定値に戻す</button>
      <span class="saved" id="saved">保存しました</span>
    </footer>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
