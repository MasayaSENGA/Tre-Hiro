<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>02 auto</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 同じ縦の範囲（自動化の一覧の上端〜下部のナビ）を、Trello 標準とトレひろで同じ倍率に並べる */
  .fig-off, .fig-on { top: 270px; }
  .tag.std, .tag.on { top: 224px; }
  .tag-note { top: 224px; }
  .result {
    position: absolute; z-index: 4;
    display: flex; align-items: center; gap: 10px;
    font-size: 18px; line-height: 1.4; font-weight: 700; color: var(--brand-ink);
    letter-spacing: 0.02em; font-feature-settings: "palt"; white-space: nowrap;
  }
  .result .dot {
    width: 12px; height: 12px; border-radius: 50%; flex: none;
    background: var(--accent-deep); box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.22);
  }
  .measure {
    position: absolute; z-index: 4;
    font-size: 15px; line-height: 1.4; font-weight: 500; color: var(--ink-3);
    white-space: nowrap; font-feature-settings: "palt";
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="stage"></div>

  <div class="brand" data-block="brand"><img src="build/icon-art.png" alt=""><span class="brand-name">トレひろ</span></div>

  <div class="head" data-block="head">
    <h1 class="headline"><span class="l">自動化ボタンを、<span class="mark">1クリックで</span></span></h1>
    <p class="sub"><span class="l">「自動化」の一覧を開かなくても、カード詳細の下部から実行</span></p>
  </div>

  <div class="tag std lbl-before" data-block="tag-off">Trello 標準</div>
  <div class="tag-note note-off" data-block="note-off">「自動化」を開いて選ぶ</div>
  <figure class="shot framed fig-off" data-geom="auto_std" data-block="fig-off"><img src="build/auto_std.png" alt=""></figure>

  <div class="tag on" data-block="tag-on"><img src="build/icon-art.png" alt=""><span class="lbl-after">トレひろ（自動化ボタンを常に表示）</span></div>
  <div class="tag-note note-on" data-block="note-on">カード詳細の下部に並ぶ</div>
  <figure class="shot framed fig-on" data-geom="auto_on" data-block="fig-on"><img src="build/auto_on.png" alt=""></figure>

  <div class="result" data-block="result"><span class="dot"></span><span class="l">押すと、その場で実行</span></div>
  <div class="measure" data-block="measure">名前・アイコン・並び順は「自動化」の一覧と同じ</div>

  <div class="footnotes" data-block="footnotes">
    <span class="footnote">※非公式ツールです。Trello・Atlassian とは関係ありません。Trello は Atlassian の商標です。</span>
    <span class="footnote2">※画面は、Trello を再現した確認用ページにトレひろの実際のコードを当てて撮影したものです。内容は架空です。</span>
  </div>
</div>
<script src="build/geometry.js"></script>
<script>
  window.layout = function (H) {
    const G = window.GEOM;
    const off = document.querySelector(".fig-off"), on = document.querySelector(".fig-on");
    const stage = H.rectOf(document.querySelector(".stage"));
    const padX = 24, gap = 48, top = 270, bottom = stage.b - 64;  // 下に結果の一言を置く分をあける
    // 同じ倍率 s: 横は台に収まる最大、縦は結果の一言の上まで
    const wOff = G.auto_std.css_w, wOn = G.auto_on.css_w;
    const sW = (stage.w - 2 * padX - gap) / (wOff + wOn);
    const sH = (bottom - top) / Math.max(G.auto_std.css_h, G.auto_on.css_h);
    const s = Math.min(sW, sH, 1);
    const x0 = stage.x + (stage.w - (wOff + wOn) * s - gap) / 2;
    off.style.left = x0 + "px";
    off.querySelector("img").style.width = (wOff * s) + "px";
    on.style.left = (x0 + wOff * s + gap) + "px";
    on.querySelector("img").style.width = (wOn * s) + "px";
    const so = H.figScale(off), sn = H.figScale(on);
    if (Math.abs(so - sn) > 0.002) H.issues.push(`before/after scales differ: ${so.toFixed(4)} / ${sn.toFixed(4)}`);
    H.issues.push(`note: before/after both at ${(so * 100).toFixed(1)}% (UI text 14px -> ${(14 * so).toFixed(1)}px)`);
    // ラベルは各図の左上に揃え、注記はその右に
    const ro = H.rectOf(off), rn = H.rectOf(on);
    const tOff = document.querySelector(".tag.std"), tOn = document.querySelector(".tag.on");
    tOff.style.left = ro.x + "px"; tOn.style.left = rn.x + "px";
    const nOff = document.querySelector(".note-off"), nOn = document.querySelector(".note-on");
    nOff.style.left = (H.rectOf(tOff).r + 12) + "px";
    nOn.style.left = (H.rectOf(tOn).r + 12) + "px";
    if (H.rectOf(nOff).r > ro.r) H.issues.push("note-off is wider than the Trello figure");
    // 目印: トレひろ側のボタンの列の左に、アンバーの三角（キャプチャの外。図と図の間のすき間）
    const bar = H.boxRect(on, "bar");
    const tipX = rn.x - 6, cy = bar.cy;
    H.head(tipX, cy, 0, { size: 16 });
    H.path(`M ${tipX - 30} ${cy} L ${tipX - 12} ${cy}`, { width: 3 });
    if (tipX - 30 < ro.r + 4) H.issues.push("bar marker overlaps the Trello figure");
    // 結果の一言はトレひろの図の下に
    const res = document.querySelector(".result"), mea = document.querySelector(".measure");
    res.style.left = (rn.x + 4) + "px";
    res.style.top = (rn.b + 18) + "px";
    mea.style.left = (rn.x + 26) + "px";
    mea.style.top = (H.rectOf(res).b + 6) + "px";
    if (H.rectOf(mea).b > stage.b - 8) H.issues.push("measure note does not fit on the stage");
    // 写っているボタンは 6 個（再現ページの「自動化」の一覧と同じ）
    if ((G.auto_on.buttons || []).length !== 6) H.issues.push("auto_on: expected 6 buttons, got " + G.auto_on.buttons);
  };
</script>
<script src="common.js"></script>
</body>
</html>
