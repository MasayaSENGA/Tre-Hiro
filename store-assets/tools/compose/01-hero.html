<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>01 hero</title>
<link rel="stylesheet" href="common.css">
<style>
  .canvas.hero { background: var(--hero-bg); }
  .deco-ring { position: absolute; border-radius: 50%; border: 34px solid rgba(255, 255, 255, 0.07); }
  .hero .lockup { position: absolute; left: 56px; top: 30px; display: flex; align-items: center; gap: 14px; }
  .hero .lockup img { width: 56px; height: 56px; display: block; filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.6)) drop-shadow(0 6px 12px rgba(4, 47, 46, 0.40)); }
  .hero .lockup .brand-name { font-size: 30px; line-height: 1.2; font-weight: 800; color: #fff; letter-spacing: 0.05em; }
  .hero .lockup .kind { font-size: 14px; line-height: 1.3; font-weight: 600; color: var(--on-tile-sub); letter-spacing: 0.06em; margin-top: 1px; }
  .hero .copy { position: absolute; left: 56px; top: 104px; }
  .hero .headline { font-size: 52px; line-height: 1.25; color: #fff; }
  .hero .headline .accent { color: var(--accent); }
  .hero .sub { margin-top: 8px; font-size: 23px; color: rgba(255, 255, 255, 0.94); }
  .hero .fig-cap { color: #fff; align-items: flex-start; }
  .hero .fig-cap svg { color: var(--accent); margin-top: 3px; }
  /* 幅の寸法線のラベル（撮影画像の外、キャプチャの上の帯に置く） */
  .dim-pill {
    position: absolute; z-index: 6;  /* 寸法線（svg.wires, z-index 5）より上 */
    height: 24px; padding: 0 12px; border-radius: 999px;
    background: #fbbf24; color: #134e4a;
    font-size: 16px; line-height: 24px; font-weight: 700; letter-spacing: 0.02em;
    white-space: nowrap; font-feature-settings: "palt";
    box-shadow: 0 0 0 3px rgba(19, 78, 74, 0.55);
  }
  .hero-card img { border-radius: 14px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.22), 0 22px 50px rgba(4, 47, 46, 0.50); }
  .popup-fig img { border-radius: 14px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.40), 0 24px 56px rgba(4, 47, 46, 0.55); }
  .hero .footnotes { bottom: 16px; }
  .hero .footnote, .hero .footnote2 { color: #fff; }
  /* 注記の下地: 白文字で 7:1 以上になるよう、下端だけ tile_deep に寄せる */
  .foot-shade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 72px;
    background: linear-gradient(180deg, rgba(19, 78, 74, 0) 0%, rgba(14, 62, 59, 0.92) 34%, rgba(13, 58, 55, 0.96) 100%);
  }
</style>
</head>
<body>
<div class="canvas hero">
  <div class="deco-ring" style="left: 860px; top: -300px; width: 640px; height: 640px;"></div>
  <div class="deco-ring" style="left: -200px; top: 520px; width: 420px; height: 420px; border-width: 26px;"></div>
  <div class="foot-shade"></div>

  <div class="lockup" data-block="lockup">
    <img src="build/icon-art.png" alt="">
    <div>
      <div class="brand-name l">トレひろ</div>
      <div class="kind l">Chrome 拡張機能</div>
    </div>
  </div>

  <div class="copy" data-block="copy">
    <h1 class="headline"><span class="l">カード詳細を、<span class="accent">画面いっぱいに</span></span></h1>
    <p class="sub"><span class="l">Trello のカード詳細を広げて、説明欄とコメント欄の比率も自由に</span></p>
  </div>

  <div class="fig-cap" data-block="cap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.4" fill="currentColor"/><circle cx="15" cy="17" r="2.4" fill="currentColor"/></svg>
    <span><span class="l">トレひろで幅95%・</span><span class="l">比率60:40に設定した場合</span></span>
  </div>

  <div class="dim-pill" data-block="dim">ウィンドウ幅の95%</div>

  <figure class="shot hero-card" data-geom="hero_card" data-block="card"><img src="build/hero_card.png" alt=""></figure>
  <figure class="shot popup-fig" data-geom="popup_default" data-block="popup" data-overlap-ok="card"><img src="build/popup_default.png" alt=""></figure>

  <div class="footnotes" data-block="footnotes">
    <span class="footnote">※非公式ツールです。Trello・Atlassian とは関係ありません。Trello は Atlassian の商標です。</span>
    <span class="footnote2">※画面は、Trello を再現した確認用ページにトレひろの実際のコードを当てて撮影したものです。内容は架空です。</span>
  </div>
</div>
<script src="build/geometry.js"></script>
<script>
  window.layout = function (H) {
    const G = window.GEOM;
    const card = document.querySelector(".hero-card"), pop = document.querySelector(".popup-fig");
    const cap = document.querySelector(".fig-cap"), pill = document.querySelector(".dim-pill");
    const copy = H.rectOf(document.querySelector(".hero .copy"));
    const foot = H.rectOf(document.querySelector(".footnotes"));
    // カード詳細: 見出しの下に寸法線の帯（28px）をあけて置く。下端は注記の上 16px まで
    const DIM = 28;
    const top = copy.b + 14 + DIM, bottom = foot.y - 16;
    const s = Math.min((bottom - top) / G.hero_card.css_h, 1);
    card.style.left = "28px";
    card.style.top = top + "px";
    card.querySelector("img").style.width = (G.hero_card.css_w * s) + "px";
    H.issues.push(`note: card dialog at ${(s * 100).toFixed(1)}% (UI text 14px -> ${(14 * s).toFixed(1)}px)`);
    // 実測: ダイアログはウィンドウ幅の 95%（寸法線のラベルと一致すること）
    const ratio = G.hero_card.measured.dialog / G.hero_card.viewport.width;
    if (Math.abs(ratio - 0.95) > 0.001) H.issues.push(`dialog is ${(ratio * 100).toFixed(1)}% of the window, label says 95%`);
    const dlg = H.boxRect(card, "dialog");
    const cardR = H.rectOf(card.querySelector("img"));
    pill.style.left = (dlg.cx - pill.offsetWidth / 2) + "px";
    pill.style.top = (top - DIM / 2 - 1 - pill.offsetHeight / 2) + "px";
    // 右の列: ポップアップ（本物）とキャプション。撮影画像には重ねず、列の上下中央に置く
    const ps = 0.8;
    const pw = G.popup_default.css_w * ps, ph = G.popup_default.css_h * ps;
    pop.querySelector("img").style.width = pw + "px";
    const colX = cardR.r + 12;
    const gapCap = 16, capH = cap.offsetHeight;
    const colTop = 34, colBottom = bottom;
    const groupTop = colTop + (colBottom - colTop - (ph + gapCap + capH)) / 2;
    pop.style.left = colX + "px";
    pop.style.top = groupTop + "px";
    cap.style.left = colX + "px";
    cap.style.top = (groupTop + ph + gapCap) + "px";
    const pr = H.rectOf(pop), cr = H.rectOf(cap);
    if (H.overlaps(pr, cardR) || H.overlaps(cr, cardR)) H.issues.push("popup or caption covers the capture");
    if (pr.r > 1280 - 24 || cr.r > 1280 - 24) H.issues.push(`right column too close to the right edge (${Math.max(pr.r, cr.r).toFixed(1)})`);
    if (H.overlaps(pr, copy)) H.issues.push("popup overlaps the headline");
    H.issues.push(`note: popup at ${(ps * 100).toFixed(0)}%; dialog ${G.hero_card.measured.dialog}px of ${G.hero_card.viewport.width}px window`);
  };
  window.afterLayout = function (H) {
    // 寸法線: ダイアログの左端〜右端（撮影画像の上の帯だけを通る）
    const card = document.querySelector(".hero-card");
    const dlg = H.boxRect(card, "dialog");
    const img = H.rectOf(card.querySelector("img"));
    const pill = H.rectOf(document.querySelector(".dim-pill"));
    const y = pill.cy;
    if (y + 8 > img.y - 2) H.issues.push("dimension line touches the capture");
    H.dimLine(dlg.x, dlg.r, y, { color: "#fbbf24", width: 2, tick: 8 });
  };
</script>
<script src="common.js"></script>
</body>
</html>
